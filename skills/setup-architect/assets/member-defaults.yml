# ============================================================================
# GENERATING NEW NAMES
# ============================================================================
#
# When adding a new specialist:
#
# 1. Determine the title (e.g., "GraphQL Expert")
# 2. Extract initials (GE)
# 3. Check balance: if more British names exist, add international (or vice versa)
# 4. Generate a name with matching initials:
#    - British: "George Ellis", "Gemma Edwards"
#    - International: "Giulia Esposito" (Italian), "Gunnar Ek" (Swedish)
# 5. Avoid duplicating initials with existing members where possible
#
# For compound titles like "YAGNI Guardian & Simplicity Advocate":
#   - Use initials from the primary/first title words (YG)
#   - Or use the most distinctive words
