# These are the canonical mnemonic names for core architecture team members.
# Names use initials matching the member's title as a memory aid.
# Mix is 50% British, 50% international for cultural diversity.
#
# When setting up a new project, use these names for core members.
# Technology-specific members should follow the same naming convention.

